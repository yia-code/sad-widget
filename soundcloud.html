<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sad SoundCloud Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #e9e7e0;
    --paper-2: #dcd9cf;
    --ink: #1d1c1a;
    --muted: #8d8a82;
    --grid: rgba(40, 38, 30, 0.07);
    --sc: #d9764a;
    --heart: #d43c3c;
    --scale: 1;
  }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { font-family: "Rajdhani", "Segoe UI", sans-serif; }
  .wrap { zoom: var(--scale); padding: 6px 10px 14px 6px; width: max-content; }

  .card {
    position: relative; width: 520px; height: 132px; box-sizing: border-box;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 14px 14px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 14px 14px,
      radial-gradient(120% 140% at 60% 40%, var(--paper) 55%, var(--paper-2) 100%);
    border: 1.5px solid var(--ink); border-radius: 3px; overflow: hidden; color: var(--ink);
    box-shadow: 0 6px 22px rgba(0,0,0,.35);
    transition: opacity .8s ease, transform .8s ease;
  }
  .card.hidden { opacity: 0; transform: translateY(8px); }
  .card::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.2  0 0 0 0 0.18  0 0 0 0 0.12  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: .22; mix-blend-mode: multiply;
  }
  .corner { position: absolute; width: 14px; height: 14px; border: 0 solid var(--ink); z-index: 6; }
  .corner.tl { top: -1px; left: -1px; border-top-width: 4px; border-left-width: 4px; }
  .corner.tr { top: -1px; right: -1px; border-top-width: 4px; border-right-width: 4px; }
  .corner.bl { bottom: -1px; left: -1px; border-bottom-width: 4px; border-left-width: 4px; }
  .corner.br { bottom: -1px; right: -1px; border-bottom-width: 4px; border-right-width: 4px; }

  /* котики */
  .cats {
    position: absolute; z-index: 2; left: -50px; top: -6px; height: 150px;
    filter: grayscale(.35) sepia(.18) contrast(1.02) brightness(1.02);
    mix-blend-mode: multiply;
    -webkit-mask-image: linear-gradient(90deg, #000 62%, transparent 92%);
            mask-image: linear-gradient(90deg, #000 62%, transparent 92%);
  }
  .cats-fade { position: absolute; z-index: 3; left: 0; top: 0; bottom: 0; width: 14px; background: linear-gradient(90deg, var(--paper), transparent); }
  /* сердце ложится поверх сердечка с фото и "оживляет" его */
  .heart { position: absolute; z-index: 5; left: 0px; top: 2px; width: 26px; height: 24px; transform-origin: center; }
  .heart path { fill: var(--heart); }
  .heart .crack { fill: none; stroke: var(--paper); stroke-width: 1.6; opacity: 0; }
  .playing .heart { animation: beat 1.6s ease-in-out infinite; }
  .paused .heart path:not(.crack) { fill: #9a8f8a; }
  .paused .heart .crack { opacity: 1; }
  @keyframes beat { 0%, 60%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(.96); } 45% { transform: scale(1.1); } }

  .content { position: absolute; z-index: 4; left: 150px; right: 104px; top: 12px; bottom: 12px; }

  .label { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; letter-spacing: 2.4px; color: var(--sc); text-transform: lowercase; }
  .label svg { width: 22px; height: 11px; fill: var(--sc); }
  .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 10px; margin-left: 2px; }
  .eq i { width: 2px; background: var(--sc); height: 3px; border-radius: 1px; }
  .playing .eq i { animation: eq 1.1s ease-in-out infinite; }
  .playing .eq i:nth-child(2) { animation-delay: -.4s; }
  .playing .eq i:nth-child(3) { animation-delay: -.8s; }
  @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 10px; } }

  .title-box { margin-top: 6px; overflow: hidden; white-space: nowrap; height: 28px; position: relative;
    -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent); }
  .title { display: inline-block; font-size: 24px; font-weight: 700; line-height: 28px; letter-spacing: .3px; padding-right: 40px; }
  .title.scroll { animation: marquee var(--dur, 12s) linear infinite; }
  @keyframes marquee { 0%, 12% { transform: translateX(0); } 88%, 100% { transform: translateX(var(--shift)); } }
  .artist { font-size: 16px; font-weight: 600; color: #5f5c55; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .bar { position: absolute; left: 0; right: 0; bottom: 18px; height: 2px; background: rgba(29,28,26,.18); }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--ink); transition: width 1s linear; }
  .bar .dot { position: absolute; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: var(--ink); left: 0; transition: left 1s linear; }
  .times { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 1px; }
  .quote { color: var(--muted); font-weight: 500; letter-spacing: 2px; opacity: .85; }

  /* полароид с обложкой */
  .polaroid {
    position: absolute; z-index: 5; right: 14px; top: 14px; width: 78px; padding: 5px 5px 16px; background: #f4f2ec;
    box-shadow: 0 2px 6px rgba(0,0,0,.28); transform: rotate(4deg);
  }
  .polaroid .img { width: 78px; height: 78px; background: #cfcac0 center / cover no-repeat; filter: grayscale(.3) sepia(.15) contrast(.95); }
  .polaroid::after { content: ""; position: absolute; top: -7px; left: 50%; width: 34px; height: 13px; margin-left: -17px; background: rgba(214, 205, 180, .75); transform: rotate(-6deg); box-shadow: 0 1px 1px rgba(0,0,0,.08); }
  .polaroid .cap { position: absolute; left: 0; right: 0; bottom: 2px; text-align: center; font-size: 9px; letter-spacing: 1.5px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card hidden" id="card">
    <img class="cats" src="cats.jpg" alt="">
    <div class="cats-fade"></div>
    <svg class="heart" viewBox="0 0 24 22" aria-hidden="true">
      <path d="M12 21s-9-5.6-9-12.2C3 5 5.6 2.5 8.6 2.5c1.6 0 2.7.7 3.4 1.7.7-1 1.8-1.7 3.4-1.7C18.4 2.5 21 5 21 8.8 21 15.4 12 21 12 21z"/>
      <path class="crack" d="M12 4.6l-1.8 4 2.6 2.2-2 3.4 1.6 3"/>
    </svg>

    <div class="content">
      <div class="label">
        <svg viewBox="0 0 44 22" aria-hidden="true"><path d="M2 20V13M5 20V11M8 20V9M11 20V10M14 20V7M17 20V6h0c1-3 4-5 8-5 5 0 9 4 9.5 8.5C38 9 42 11.5 42 15c0 3-2.4 5-5.5 5H17z"/></svg>
        <span id="state">now playing</span>
        <span class="eq"><i></i><i></i><i></i></span>
      </div>
      <div class="title-box"><span class="title" id="title">—</span></div>
      <div class="artist" id="artist"></div>
      <div class="bar"><div class="fill" id="fill"></div><div class="dot" id="dot"></div></div>
      <div class="times"><span id="pos">0:00</span><span class="quote" id="quote">headphones on, world off.</span><span id="dur">0:00</span></div>
    </div>

    <div class="polaroid"><div class="img" id="cover"></div><div class="cap">on repeat</div></div>

    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
  </div>
</div>

<script>
  // Параметры: ?topic=<канал из topic.txt>  &scale=1.5  &quote=текст  &hide=0 (не прятать на паузе)  &demo=1
  const q = new URLSearchParams(location.search);
  const $ = id => document.getElementById(id);
  document.documentElement.style.setProperty('--scale', parseFloat(q.get('scale')) || 1);
  if (q.has('quote')) $('quote').textContent = q.get('quote');
  const hideWhenIdle = q.get('hide') !== '0';

  const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  let state = null, lastTitle = null, fetchedAt = 0, idleSince = null;

  function setTitle(text) {
    const t = $('title');
    t.classList.remove('scroll');
    t.textContent = text;
    requestAnimationFrame(() => {
      const box = t.parentElement.clientWidth;
      const over = t.scrollWidth - box;
      if (over > 0) {
        t.style.setProperty('--shift', `-${over}px`);
        t.style.setProperty('--dur', `${Math.max(8, over / 18 + 6)}s`);
        t.classList.add('scroll');
      }
    });
  }

  function draw() {
    if (!state) return;
    const card = $('card');
    let pos = state.position;
    if (state.playing) pos += (Date.now() - fetchedAt) / 1000;
    // скрипт на ПК закрыли посреди трека — трек "доиграл", прячемся
    const stale = state.playing && state.duration > 0 && pos > state.duration + 15;
    if (state.duration > 0) pos = Math.min(pos, state.duration);
    const pct = state.duration > 0 ? (pos / state.duration) * 100 : 0;
    $('fill').style.width = pct + '%';
    $('dot').style.left = pct + '%';
    $('pos').textContent = fmt(pos);
    $('dur').textContent = state.duration > 0 ? fmt(state.duration) : '–:––';
    card.classList.toggle('playing', !!state.playing);
    card.classList.toggle('paused', !state.playing);
    $('state').textContent = state.playing ? 'now playing' : 'paused';

    const idle = !state.has || !state.playing;
    if (idle) { idleSince = idleSince || Date.now(); } else { idleSince = null; }
    // прячем, если ничего нет, или пауза дольше 20 сек
    const hide = stale || (hideWhenIdle && (!state.has || (idleSince && Date.now() - idleSince > 20000)));
    card.classList.toggle('hidden', hide);
  }

  function apply(d) {
    // позиция была замерена в момент d.ts на том же ПК
    fetchedAt = d.ts || Date.now();
    state = d;
    const key = d.title + '|' + d.artist;
    if (d.has && key !== lastTitle) {
      lastTitle = key;
      setTitle(d.title || '—');
      $('artist').textContent = d.artist || '';
    }
    if (d.has) $('cover').style.backgroundImage = d.cover ? `url("${d.cover}")` : 'url("cats.jpg")';
    draw();
  }

  if (q.get('demo') === '1') {
    apply({ has: true, playing: true, title: 'Автостопом По Фазе Сна — Ты', artist: 'GiGi', position: 40, duration: 126.4, cover: null, ts: Date.now() });
  } else {
    // данные приходят от скрипта на ПК через ntfy.sh (канал = topic из ссылки)
    const topic = (q.get('topic') || '').replace(/[^\w-]/g, '');
    if (topic) {
      const es = new EventSource(`https://ntfy.sh/${topic}/sse?since=latest`);
      es.onmessage = ev => {
        try {
          const m = JSON.parse(ev.data);
          if (m.event !== 'message' || !m.message || m.message[0] !== '{') return;
          apply(JSON.parse(m.message));
        } catch (e) { /* не наше сообщение (например, файл обложки) */ }
      };
    }
  }
  setInterval(draw, 1000);
</script>
</body>
</html>
