<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sad Faceit Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #e9e7e0;
    --paper-2: #dcd9cf;
    --ink: #1d1c1a;
    --ink-soft: #4a4843;
    --muted: #8d8a82;
    --grid: rgba(40, 38, 30, 0.07);
    --win: #3fae5a;
    --lose: #d0473f;
    --scale: 1;
  }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { font-family: "Rajdhani", "Segoe UI", sans-serif; }

  .wrap { zoom: var(--scale); padding: 6px 10px 14px 6px; width: max-content; }

  .card {
    position: relative;
    width: 560px; height: 150px;
    box-sizing: border-box;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 14px 14px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 14px 14px,
      radial-gradient(120% 140% at 30% 40%, var(--paper) 55%, var(--paper-2) 100%);
    border: 1.5px solid var(--ink);
    border-radius: 3px;
    overflow: hidden;
    color: var(--ink);
    box-shadow: 0 6px 22px rgba(0,0,0,.35);
  }
  /* грязь / шум бумаги */
  .card::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.2  0 0 0 0 0.18  0 0 0 0 0.12  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: .22; mix-blend-mode: multiply;
  }
  /* уголки-скобки как на референсе */
  .corner { position: absolute; width: 14px; height: 14px; border: 0 solid var(--ink); z-index: 6; }
  .corner.tl { top: -1px; left: -1px; border-top-width: 4px; border-left-width: 4px; }
  .corner.tr { top: -1px; right: -1px; border-top-width: 4px; border-right-width: 4px; }
  .corner.bl { bottom: -1px; left: -1px; border-bottom-width: 4px; border-left-width: 4px; }
  .corner.br { bottom: -1px; right: -1px; border-bottom-width: 4px; border-right-width: 4px; }

  /* арт */
  .art {
    position: absolute; z-index: 2;
    width: 300px; left: 352px; top: -66px;
    filter: grayscale(.5) sepia(.2) contrast(.92) brightness(1.32);
    mix-blend-mode: multiply;
    opacity: .78;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, transparent 2%, rgba(0,0,0,.55) 22%, #000 42%);
            mask-image: linear-gradient(90deg, transparent 0%, transparent 2%, rgba(0,0,0,.55) 22%, #000 42%);
  }

  /* декор: шестерня + прицелы */
  .deco { position: absolute; z-index: 2; fill: none; stroke: var(--ink-soft); pointer-events: none; }
  .gear { left: -26px; top: -18px; width: 132px; height: 132px; opacity: .22; stroke-width: 2; }
  .cross1 { left: 92px; top: 76px; width: 92px; height: 92px; opacity: .16; stroke-width: 1.4; }
  .cross2 { left: 268px; top: 10px; width: 64px; height: 64px; opacity: .14; stroke-width: 1.4; }
  .scratch { position: absolute; z-index: 2; height: 2px; background: var(--ink-soft); opacity: .12; border-radius: 2px; }

  .content { position: absolute; inset: 0; z-index: 4; }

  .lvl { position: absolute; left: 22px; top: 18px; width: 64px; height: 64px; }
  .lvl svg { width: 100%; height: 100%; transform: rotate(135deg); }
  .lvl .num {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-weight: 700; font-size: 26px; padding-top: 4px;
    text-shadow: 0 0 1px rgba(0,0,0,.25);
  }

  .nick { position: absolute; left: 104px; top: 16px; font-size: 22px; font-weight: 700; letter-spacing: .3px; max-width: 170px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .elo { position: absolute; left: 102px; top: 38px; font-size: 40px; font-weight: 700; display: flex; align-items: center; gap: 4px; letter-spacing: .5px; }
  .elo svg { width: 20px; height: 12px; margin-top: 4px; }
  .delta { font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 6px; margin-top: 12px; }

  .stats { position: absolute; right: 18px; top: 12px; display: flex; gap: 22px; }
  .stat { text-align: center; min-width: 46px; }
  .stat b { display: block; font-size: 34px; font-weight: 500; line-height: 1; color: #22211e; text-shadow: 0 0 8px rgba(233,231,224,.95), 0 0 3px rgba(233,231,224,1), 0 0 1px rgba(233,231,224,1); }
  .stat span { display: inline-block; margin-top: 6px; padding: 0 3px; font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #6f6c64; background: rgba(233,231,224,.72); border-radius: 2px; }

  .divider { position: absolute; left: 0; right: 0; top: 100px; height: 1.5px; background: var(--ink); opacity: .85; }

  .bottom { position: absolute; left: 18px; right: 18px; top: 108px; height: 32px; display: flex; align-items: center; gap: 18px; font-size: 19px; font-weight: 700; }
  .rk { display: flex; align-items: center; gap: 7px; }
  .rk img { height: 15px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.2); }
  .last { margin-left: auto; display: flex; gap: 9px; font-size: 22px; font-weight: 700; letter-spacing: 1px; }
  .last .W { color: var(--win); text-shadow: 0 0 6px rgba(233,231,224,1); }
  .last .L { color: var(--lose); text-shadow: 0 0 6px rgba(233,231,224,1); }

  .quote { position: absolute; left: 104px; top: 84px; font-size: 10px; font-weight: 500; letter-spacing: 2.5px; color: var(--muted); opacity: .8; text-transform: lowercase; }

  .err { position: absolute; left: 104px; bottom: 6px; font-size: 11px; color: var(--lose); }
</style>
</head>

      <path d="M50 6v26M50 68v26M6 50h26M68 50h26"/>
    </svg>
    <div class="scratch" style="left:300px;top:58px;width:40px"></div>
    <div class="scratch" style="left:244px;top:86px;width:22px"></div>
    <div class="scratch" style="left:420px;top:90px;width:56px"></div>

    <div class="content">
      <div class="lvl">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(0,0,0,.2)" stroke-width="6" stroke-dasharray="122.5 200" stroke-linecap="round"/>
          <circle id="arc" cx="32" cy="32" r="26" fill="none" stroke="#e8c13a" stroke-width="6" stroke-dasharray="0 200" stroke-linecap="round"/>
        </svg>
        <div class="num" id="lvl">–</div>
      </div>

      <div class="nick" id="nick">loading…</div>
      <div class="elo">
        <svg viewBox="0 0 20 12" aria-hidden="true"><path d="M1 9l4-6 4 6 4-6 4 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
        <span id="elo">0</span>
      </div>
      <div class="quote" id="quote">it's just a game.</div>

      <div class="stats">
        <div class="stat"><b id="adr">–</b><span>ADR</span></div>
        <div class="stat"><b id="avg">–</b><span>AVG</span></div>
        <div class="stat"><b id="kd">–</b><span>KD</span></div>
        <div class="stat"><b id="kr">–</b><span>KR</span></div>
      </div>

      <div class="divider"></div>

      <div class="bottom">
        <div class="rk"><img id="regFlag" alt=""><span id="rank">#–</span></div>
        <div class="rk"><img id="ctryFlag" alt=""><span id="rankC">#–</span></div>
        <div class="last" id="last"></div>
      </div>
      <div class="err" id="err"></div>
    </div>

    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
  </div>
</div>

<script>
  // Использование: sad-widget.html?player=<id>&secret=<secret>
  // (те же player и secret, что в твоей ссылке strugly). Доп. параметры:
  //   scale=1.5  — размер,  quote=текст — подпись под ELO (quote= пусто — убрать)
  const q = new URLSearchParams(location.search);
  const player = q.get('player');
  const secret = q.get('secret');
  const $ = id => document.getElementById(id);

  document.documentElement.style.setProperty('--scale', parseFloat(q.get('scale')) || 1);
  if (q.has('quote')) $('quote').textContent = q.get('quote');

  const LVL_COLORS = { 1: '#d8d8d8', 2: '#3fbf3a', 3: '#3fbf3a', 4: '#e8c13a', 5: '#e8c13a', 6: '#e8c13a', 7: '#e8c13a', 8: '#ef7a2a', 9: '#ef7a2a', 10: '#e2352b' };
  const fmt = n => (n == null || n === '') ? '–' : String(n);

  function render(d) {
    const lvl = +d.skill_level || 0;
    $('lvl').textContent = lvl || '–';
    $('lvl').style.color = LVL_COLORS[lvl] || '#999';
    const arc = $('arc');
    arc.setAttribute('stroke', LVL_COLORS[lvl] || '#999');
    arc.setAttribute('stroke-dasharray', `${(122.5 * Math.max(lvl, 0.3) / 10).toFixed(1)} 200`);

    $('nick').textContent = d.nickname || '—';
    $('elo').textContent = fmt(d.faceit_elo);

    const s = d.stats || {};
    $('adr').textContent = s.adr != null ? Math.round(s.adr) : '–';
    $('avg').textContent = s.avg != null ? Math.round(s.avg) : '–';
    $('kd').textContent = s.kd != null ? (+s.kd).toFixed(2) : '–';
    $('kr').textContent = s.kr != null ? (+s.kr).toFixed(2) : '–';

    $('rank').textContent = '#' + fmt(d.rank);
    $('rankC').textContent = '#' + fmt(d.rank_country);
    if (d.region) $('regFlag').src = `https://strugly.com/images/flags/${String(d.region).toLowerCase()}.png`;
    if (d.country) $('ctryFlag').src = `https://strugly.com/images/flags/${String(d.country).toLowerCase()}.png`;

    const lf = (d.lastfive && d.lastfive.widget) || {};
    $('last').innerHTML = Object.keys(lf).sort().map(k => `<span class="${lf[k] === 'W' ? 'W' : 'L'}">${lf[k] === 'W' ? 'W' : 'L'}</span>`).join('');
  }

  async function load() {
    if (!player || !secret) {
      // демо без ссылки — чтобы было видно дизайн
      render({ nickname: 'sanryu', skill_level: 3, faceit_elo: 800, region: 'EU', country: 'md', rank: 1450500, rank_country: 4686,
               stats: { adr: 76.9, avg: 14.67, kd: 0.94, kr: 0.7 }, lastfive: { widget: { 0: 'L', 1: 'W', 2: 'L', 3: 'L', 4: 'W' } } });
      return;
    }
    try {
      const url = `https://strugly.com/api/faceit_api_v2.php?player=${encodeURIComponent(player)}&secret=${encodeURIComponent(secret)}&fields=fi,last20,ranking,ranking-country&time=${Date.now()}`;
      const r = await fetch(url, { cache: 'no-store' });
      const d = await r.json();
      render(d);
      $('err').textContent = '';
    } catch (e) {
      $('err').textContent = 'нет связи с strugly…';
    }
  }

  load();
  setInterval(load, 30000);
</script>
</body>
</html>
